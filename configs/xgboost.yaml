# XGBoost Configuration
# ======================

model:
  name: xgb
  hyperparams:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 5 #minimum number of samples required to be at a leaf node
    subsample: 0.6 #rows of train data shown before growing trees
    colsample_bytree: 0.6 #similar to subsample, but for columns
    scale_pos_weight: 1  # For balanced classes, can use ratio
    random_state: 42
    early_stopping_rounds: 50
    objective: binary:logistic  # Binary classification objective
    eval_metric: ["logloss", "error"]
    eval_names: ["training", "valid_1"]

training:
  train_ratio: 0.7
  valid_ratio: 0.2

data:
  path: data/training_data_features.csv

experiment:
  name: notification_xgboost
