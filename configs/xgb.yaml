# XGBoost Configuration
# ======================

model:
  name: xgb
  hyperparams:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 1
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 1  # For balanced classes, can use ratio
    random_state: 42
    early_stopping_rounds: 50
    objective: binary:logistic  # Binary classification objective
    eval_metric: logloss

training:
  train_ratio: 0.7
  valid_ratio: 0.2

data:
  path: data/training_data_features.csv

experiment:
  name: trainer_test_xgboost
